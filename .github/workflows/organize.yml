# .github/workflows/organize.yml
name: Update LeetCode notebooks

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:
    inputs:
      migrate_history:
        description: Migrate historical LeetSync results once before normal synchronization
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: organize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  organize:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Configure Git bot
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      - name: Synchronize and publish with retries
        env:
          MIGRATE_HISTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_history }}
        run: |
          args=()
          if [[ "$MIGRATE_HISTORY" == "true" ]]; then
            args+=(--migrate-history)
          fi
          python scripts/publish_history.py "${args[@]}"
