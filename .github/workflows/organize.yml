# .github/workflows/organize.yml
name: Update LeetCode notebooks

on:
  push:
    branches:
      - test
  workflow_dispatch:
    inputs:
      migrate_history:
        description: Migrate historical LeetSync results once before normal synchronization
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: organize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  organize:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          ref: test
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Configure Git bot
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      - name: Remember remote branch before processing
        run: echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Migrate historical results when requested
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_history
        run: |
          python scripts/sync_history.py --migrate-history --report "$RUNNER_TEMP/leetsync-migration.json"
          cat "$RUNNER_TEMP/leetsync-migration.json"
      - name: Normalize submissions and retain best runtimes
        run: python scripts/sync_history.py
      - name: Publish only if the remote branch has not changed
        run: git push --force-with-lease="refs/heads/test:$EXPECTED_HEAD" origin HEAD:refs/heads/test
