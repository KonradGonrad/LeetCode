# .github/workflows/organize.yml
name: Update LeetCode notebooks

on:
  push:
    branches:
      - test
    paths:
      - "solutions/**"
      - "Algorithm/**"
      - "Database/**"
      - "Pandas/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          ref: test
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Configure Git bot
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      - name: Prepare notebooks and update README
        run: python scripts/organizer.py
      - name: Push generated commits
        run: git push
